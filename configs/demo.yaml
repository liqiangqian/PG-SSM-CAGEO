# Demonstration configuration aligned with manuscript settings:
# five-spot unit, 28-day input window, 7-day forecast horizon,
# soft physical-plausibility regularization (delta_max, lambda_mass, lambda_mono),
# directional topology prior coefficient alpha.

seed: 2026
device: auto  # cuda if available else cpu

data:
  csv_path: data/synthetic_demo.csv
  date_column: date
  target_column: uranium_concentration
  fast_columns:
    - inj1_flow
    - inj2_flow
    - inj3_flow
    - inj4_flow
    - prod_flow
  slow_columns:
    - inj1_pH
    - inj2_pH
    - inj3_pH
    - inj4_pH
    - inj1_DO
    - inj2_DO
    - inj3_DO
    - inj4_DO
  input_window: 28
  forecast_horizon: 7
  train_ratio: 0.70
  val_ratio: 0.15
  # test_ratio implied

graph:
  topology: fivespot
  sigma_d: 50.0
  alpha: 0.2
  flow_aware: true
  injector_relative_xy_m:
    - [50.0, 0.0]
    - [-50.0, 0.0]
    - [0.0, 50.0]
    - [0.0, -50.0]
  center_xy_m: [0.0, 0.0]

model:
  hidden_dim: 128
  tcn_channels: [64, 128]
  lstm_layers: 2
  dropout: 0.15
  n_static_features: 2

physics_loss:
  delta_max: 0.20
  lambda_mass: 0.01
  lambda_mono: 0.01
  lambda_smooth: 0.001

train:
  batch_size: 32
  epochs: 120
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  early_stopping_patience: 25
  scheduler_t_max: 120

paths:
  checkpoint: outputs/pgssm_demo.pt
  metrics_train_val: outputs/metrics_train_val.json
  metrics_test: outputs/metrics_test.json
